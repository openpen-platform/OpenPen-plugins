name: Validate catalog PR

# Checks a registration or update PR against the catalog acceptance conditions and posts one
# comment listing each condition. It only reports: it never merges and never closes the PR.
# All logic lives in scripts/validate-pr.mjs (unit-tested); this file only calls it.
#
# pull_request_target is used so PRs from forks can receive a comment. The job checks out the
# base branch only and reads the PR's manifests with `git show` as data; no PR code is executed.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - 'plugins/**'
      - 'plugins.json'
      - 'community/plugins.json'

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Default checkout for pull_request_target is the current tip of the base branch.
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch PR head (objects only, not checked out)
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
      - name: Validate and comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: a token that can read openpen-platform org members. Without it only public
          # membership is visible and @openpen/* changes by private members fail the member check.
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/validate-pr.mjs \
            --repo . \
            --base HEAD \
            --head refs/remotes/pr/head \
            --pr-author "$PR_AUTHOR" \
            --post-comment --pr-repo "$REPO" --pr-number "$PR_NUMBER"
          # Add --forbid-index-edit here once the aggregate index is generated automatically.
